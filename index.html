<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPCS 2026 - TCS Pattern Mock Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --tcs-blue: #1e88e5;
            --tcs-dark: #004085;
            --ans-green: #2ecc71;
            --rev-purple: #9b59b6;
            --not-ans-red: #e74c3c;
            --not-vis-grey: #ecf0f1;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f4f7f6; }

        /* Header Area */
        header { background: var(--tcs-dark); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .timer-box { background: #fff; color: #333; padding: 5px 15px; border-radius: 4px; font-weight: bold; }

        /* Main Layout */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* Left Side: Question Area */
        .question-section { flex: 3; padding: 20px; overflow-y: auto; background: white; border-right: 2px solid #ddd; }
        .q-header { border-bottom: 2px solid var(--tcs-blue); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .option { display: block; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .option:hover { background: #f8f9fa; border-color: var(--tcs-blue); }
        .option input { margin-right: 15px; transform: scale(1.2); }
        .selected-opt { background: #e3f2fd !important; border-color: var(--tcs-blue) !important; }

        /* Right Side: Palette */
        .palette-section { width: 320px; background: #f9f9f9; padding: 15px; display: flex; flex-direction: column; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
        .q-btn { width: 45px; height: 45px; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; border-radius: 4px; }
        
        /* Status Colors */
        .q-answered { background: var(--ans-green); color: white; border: none; }
        .q-not-answered { background: var(--not-ans-red); color: white; border: none; }
        .q-review { background: var(--rev-purple); color: white; border: none; }
        .q-active { border: 2px solid #333 !important; }

        /* Action Buttons */
        .action-bar { border-top: 1px solid #ddd; padding: 15px; display: flex; gap: 10px; background: white; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-next { background: var(--tcs-blue); color: white; }
        .btn-review { background: #f39c12; color: white; }
        .btn-clear { background: #bdc3c7; }
        .btn-finish { background: var(--ans-green); color: white; margin-left: auto; }

        /* Results & Charts */
        #results-area { display: none; padding: 40px; background: white; width: 100%; overflow-y: auto; }
        .chart-container { width: 600px; margin: 30px auto; }
        .explanation-box { margin-top: 10px; padding: 10px; background: #e1f5fe; border-left: 4px solid var(--tcs-blue); display: block; font-size: 0.9em; }

        @media (max-width: 768px) { .main-container { flex-direction: column; } .palette-section { width: 100%; order: -1; } }
    </style>
</head>
<body>

<header>
    <div>MPPCS PRELIMS 2026 - PAPER I</div>
    <div class="timer-box" id="timer">Time Left: 120:00</div>
</header>

<div class="main-container" id="exam-ui">
    <div class="question-section">
        <div class="q-header">
            <span id="q-number" style="font-weight: bold; font-size: 1.2em;">Question 1</span>
            <span style="color: #666;">Marks: +3, -1</span>
        </div>
        <div id="q-content" class="question-text" style="font-size: 1.1em; margin-bottom: 20px;"></div>
        <div id="options-area"></div>
        
        <div class="action-bar">
            <button class="btn btn-review" onclick="markReview()">Mark for Review & Next</button>
            <button class="btn btn-clear" onclick="clearResponse()">Clear Response</button>
            <button class="btn btn-next" onclick="saveNext()">Save & Next</button>
        </div>
    </div>

    <div class="palette-section">
        <h4 style="margin-top: 0;">Question Palette</h4>
        <div class="palette-grid" id="palette"></div>
        <button class="btn btn-finish" style="margin-top: 30px; width: 100%;" onclick="showResults()">Final Submit</button>
    </div>
</div>

<div id="results-area">
    <h2 style="text-align: center;">Exam Performance Analytics</h2>
    <div class="chart-container">
        <canvas id="scoreChart"></canvas>
    </div>
    <div id="scorecard-text" style="text-align: center; font-size: 1.3em; margin-bottom: 30px;"></div>
    
    <h3>Detailed Review & Answer Sheet</h3>
    <div id="review-list"></div>
    <button class="btn btn-next" onclick="location.reload()" style="margin: 20px auto; display: block;">Retake Test</button>
</div>

<script>
    // Full Data from your file
    const quizData = [
        { q: "कुमाऊँ हिमालय का सबसे ऊँचा शिखर कौन-सा है? / Highest peak of Kumaon Himalayas?", o: ["कामेट", "नंदा देवी", "त्रिशूल", "बद्रीनाथ"], a: 1, e: "नंदा देवी 7816 मीटर ऊँची है और कुमाऊँ हिमालय की सबसे ऊँची चोटी है।" },
        { q: "किस नदी का प्राचीन नाम अस्किनी था? / Which river had the ancient name Askini?", o: ["ब्यास", "चिनाब", "झेलम", "रावी"], a: 1, e: "चिनाब नदी का प्राचीन नाम अस्किनी था।" },
        { q: "ISFR 2023 के अनुसार वनों के अंतर्गत देश के शीर्ष तीन राज्य कौन-से थे?", o: ["MP, JH, CG", "MP, AP, CG", "MP, AP, SK", "MP, MH, OR"], a: 1, e: "शीर्ष तीन राज्य MP, अरुणाचल प्रदेश और छत्तीसगढ़ हैं।" },
        { q: "पश्चिमी विक्षोभ के बारे में सही कथन चुनें: (a) पछुआ हवा (b) भूमध्यसागर (c) शीत ऋतु वर्षा", o: ["केवल c", "a और c", "b और c", "सभी a, b, c"], a: 3, e: "पश्चिमी विक्षोभ पछुआ हवाओं द्वारा भूमध्यसागर से नमी लाकर NW भारत में वर्षा कराते हैं।" },
        { q: "भारत की सबसे लम्बी झील कौन-सी है?", o: ["चिल्का", "कोल्लेरू", "वेम्बनाड", "पूकोड"], a: 2, e: "वेम्बनाड झील (केरल) भारत की सबसे लंबी (96 किमी) झील है।" },
        { q: "EPROM का पूरा नाम क्या है?", o: ["Electrically P-ROM", "Electronically P-ROM", "Extended P-ROM", "Erasable P-ROM"], a: 3, e: "EPROM stands for Erasable Programmable Read-Only Memory." },
        { q: "मोहन नागर को 2026 में पद्मश्री किस क्षेत्र में मिला?", o: ["खेल", "राजनीति", "उद्योग", "पर्यावरण"], a: 3, e: "उन्हें पर्यावरण संरक्षण के लिए सम्मानित किया गया।" }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let status = new Array(quizData.length).fill('not-visited'); // answered, review, not-answered

    function init() {
        const pal = document.getElementById('palette');
        quizData.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.className = 'q-btn';
            btn.id = `pal-${i}`;
            btn.innerText = i + 1;
            btn.onclick = () => jumpTo(i);
            pal.appendChild(btn);
        });
        showQuestion();
    }

    function showQuestion() {
        const q = quizData[currentIdx];
        document.getElementById('q-number').innerText = `Question ${currentIdx + 1}`;
        document.getElementById('q-content').innerText = q.q;
        
        const area = document.getElementById('options-area');
        area.innerHTML = '';
        q.o.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentIdx] === i ? 'selected-opt' : ''}`;
            div.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentIdx] === i ? 'checked' : ''}> ${opt}`;
            div.onclick = () => selectOption(i, div);
            area.appendChild(div);
        });

        // Update Palette UI
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('q-active'));
        document.getElementById(`pal-${currentIdx}`).classList.add('q-active');
    }

    function selectOption(idx, el) {
        userAnswers[currentIdx] = idx;
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected-opt'));
        el.classList.add('selected-opt');
    }

    function saveNext() {
        if (userAnswers[currentIdx] !== null) {
            status[currentIdx] = 'answered';
            document.getElementById(`pal-${currentIdx}`).className = 'q-btn q-answered';
        } else {
            status[currentIdx] = 'not-answered';
            document.getElementById(`pal-${currentIdx}`).className = 'q-btn q-not-answered';
        }
        if (currentIdx < quizData.length - 1) {
            currentIdx++;
            showQuestion();
        }
    }

    function markReview() {
        status[currentIdx] = 'review';
        document.getElementById(`pal-${currentIdx}`).className = 'q-btn q-review';
        if (currentIdx < quizData.length - 1) {
            currentIdx++;
            showQuestion();
        }
    }

    function clearResponse() {
        userAnswers[currentIdx] = null;
        showQuestion();
    }

    function jumpTo(i) {
        currentIdx = i;
        showQuestion();
    }

    function showResults() {
        document.getElementById('exam-ui').style.display = 'none';
        document.getElementById('results-area').style.display = 'block';

        let correct = 0, wrong = 0, unattempted = 0;
        const reviewList = document.getElementById('review-list');

        quizData.forEach((data, i) => {
            const isCorrect = userAnswers[i] === data.a;
            if (userAnswers[i] === null) unattempted++;
            else if (isCorrect) correct++;
            else wrong++;

            const div = document.createElement('div');
            div.style.padding = "15px";
            div.style.borderBottom = "1px solid #ddd";
            div.innerHTML = `
                <p><b>Q${i+1}:</b> ${data.q}</p>
                <p style="color:${isCorrect ? 'green' : 'red'}">Your Answer: ${userAnswers[i] !== null ? data.o[userAnswers[i]] : 'Not Attempted'}</p>
                <p style="color:green">Correct: ${data.o[data.a]}</p>
                <div class="explanation-box"><b>Explanation:</b> ${data.e}</div>
            `;
            reviewList.appendChild(div);
        });

        const totalScore = (correct * 3) - (wrong * 1);
        document.getElementById('scorecard-text').innerHTML = `Final Score: <b>${totalScore}</b> | Correct: ${correct} | Wrong: ${wrong}`;

        // Chart.js Visualization
        new Chart(document.getElementById('scoreChart'), {
            type: 'bar',
            data: {
                labels: ['Correct', 'Wrong', 'Unattempted'],
                datasets: [{
                    label: 'Question Count',
                    data: [correct, wrong, unattempted],
                    backgroundColor: ['#2ecc71', '#e74c3c', '#95a5a6']
                }]
            }
        });
    }

    init();
</script>

</body>
</html>
